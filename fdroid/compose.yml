# Self-hosted F-Droid repository.
#
#   1. Copy .env.example to .env and fill it in.
#   2. Run: docker compose up -d
#
# The "fdroid" service signs and indexes the APK files. It can also send them
# to an S3 bucket.
# The "web" service publishes the repository from this host. It starts only
# when COMPOSE_PROFILES contains "web".

services:
  fdroid:
    build: .
    image: fdroid-repo:local
    container_name: fdroid-repo
    restart: unless-stopped
    environment:
      FDROID_BASE_URL: ${FDROID_BASE_URL:?set FDROID_BASE_URL in .env}
      FDROID_REPO_NAME: ${FDROID_REPO_NAME:-My F-Droid Repo}
      FDROID_REPO_DESCRIPTION: ${FDROID_REPO_DESCRIPTION:-A privately hosted F-Droid repository.}
      FDROID_REPO_ICON: ${FDROID_REPO_ICON:-}
      FDROID_KEY_ALIAS: ${FDROID_KEY_ALIAS:-myrepo}
      FDROID_KEY_DNAME: ${FDROID_KEY_DNAME:-}
      FDROID_ARCHIVE_OLDER: ${FDROID_ARCHIVE_OLDER:-0}
      FDROID_MIRRORS: ${FDROID_MIRRORS:-}
      FDROID_SCAN_INTERVAL: ${FDROID_SCAN_INTERVAL:-60}
      # S3. Leave FDROID_S3_BUCKET empty to keep the repository on this host.
      FDROID_S3_BUCKET: ${FDROID_S3_BUCKET:-}
      FDROID_RCLONE_REMOTE: ${FDROID_RCLONE_REMOTE:-}
      FDROID_S3_PULL_PREFIX: ${FDROID_S3_PULL_PREFIX:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      TZ: ${TZ:-UTC}
    volumes:
      # Holds config.yml, keystore.p12, repo/ and metadata/. Back this up.
      # An optional rclone.conf for a non-AWS S3 service also goes here.
      - ./data:/data

  web:
    image: caddy:2-alpine
    container_name: fdroid-web
    restart: unless-stopped
    profiles: ["web"]
    depends_on:
      - fdroid
    environment:
      FDROID_SITE_ADDRESS: ${FDROID_SITE_ADDRESS:-:80}
    ports:
      - "${FDROID_HTTP_PORT:-80}:80"
      - "${FDROID_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Only the published directories are mounted. The signing key and
      # config.yml stay outside the web root.
      - ./data/repo:/srv/fdroid/repo:ro
      - ./data/archive:/srv/fdroid/archive:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
